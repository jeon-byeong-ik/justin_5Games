<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>도형 방어전 · Shape Defense</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; font-family:'Trebuchet MS',system-ui,sans-serif; background:#1a1400; color:#fff; user-select:none; }
  #game { position:relative; width:100vw; height:100vh; overflow:hidden;
    background:radial-gradient(circle at 50% 25%, #2e2400 0%, #1a1a05 60%, #14100a 100%); }
  canvas { display:block; width:100%; height:100%; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; background:rgba(20,16,5,0.93); backdrop-filter:blur(8px); z-index:50; }
  .hidden { display:none !important; }
  h1 { font-size:clamp(28px,7vw,44px); font-weight:900; letter-spacing:2px; margin-bottom:6px;
    background:linear-gradient(135deg,#fff,#FFD23D); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .sub { color:#FFD23D; letter-spacing:4px; font-size:12px; margin-bottom:28px; }
  .char-grid { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:560px; margin-bottom:24px; }
  .char-card { width:96px; padding:12px 8px; border-radius:14px; cursor:pointer; background:rgba(255,255,255,0.04);
    border:2px solid rgba(255,255,255,0.12); transition:all 0.2s; }
  .char-card:hover { transform:translateY(-4px); }
  .char-card.sel { border-color:var(--ac); box-shadow:0 0 20px var(--gl); background:rgba(255,255,255,0.08); }
  .char-card svg { width:52px; height:60px; }
  .char-card .nm { font-size:12px; font-weight:800; margin-top:6px; letter-spacing:1px; }
  .char-card .ro { font-size:9px; color:#888; margin-top:2px; }
  .lvl-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:26px; }
  .lvl-btn { padding:8px 16px; border-radius:20px; cursor:pointer; font-weight:800; font-size:13px;
    background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.15); color:#bbb; transition:all 0.2s; }
  .lvl-btn.sel { background:#FFD23D; border-color:#FFD23D; color:#1a1400; box-shadow:0 0 16px #FFD23D88; }
  .btn { padding:14px 40px; border-radius:30px; cursor:pointer; font-weight:900; font-size:17px; letter-spacing:1px;
    border:none; background:linear-gradient(135deg,#FFD23D,#A0F0FF); color:#1a1400; box-shadow:0 8px 24px rgba(255,210,61,0.4); transition:all 0.2s; }
  .btn:hover { transform:scale(1.05); } .btn:active { transform:scale(0.98); }
  .label { font-size:11px; letter-spacing:3px; color:#666; margin-bottom:12px; }
  #hud { position:absolute; top:0; left:0; right:0; padding:14px 18px; display:flex; justify-content:space-between; z-index:20; pointer-events:none; }
  .hud-box { background:rgba(46,36,0,0.7); border:1px solid rgba(255,210,61,0.4); border-radius:12px; padding:8px 14px; backdrop-filter:blur(4px); }
  .hud-box .k { font-size:9px; letter-spacing:2px; color:#FFD23D; } .hud-box .v { font-size:20px; font-weight:900; }
  /* 조건 표시 */
  #rule { position:absolute; top:80px; left:50%; transform:translateX(-50%); z-index:20; background:rgba(46,36,0,0.92);
    border:2px solid #A0F0FF; border-radius:16px; padding:12px 24px; text-align:center; box-shadow:0 0 24px rgba(160,240,255,0.3); }
  #rule .r { font-size:18px; font-weight:900; color:#A0F0FF; } #rule .h { font-size:10px; color:#888; letter-spacing:1px; margin-top:3px; }
  #combo { position:absolute; top:46%; left:50%; transform:translate(-50%,-50%); font-size:40px; font-weight:900; opacity:0;
    pointer-events:none; z-index:15; text-shadow:0 0 20px #FFD23D; color:#FFD23D; }
  @keyframes pop { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.5);} 30%{opacity:1;transform:translate(-50%,-50%) scale(1.2);}
    100%{opacity:0;transform:translate(-50%,-80%) scale(1);} }
  .combo-anim { animation:pop 0.8s ease-out; }
  .final-stat { display:flex; gap:24px; margin:18px 0 26px; }
  .final-stat .n { font-size:32px; font-weight:900; color:#FFD23D; } .final-stat .l { font-size:11px; color:#888; }
  .back { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:20; background:rgba(46,36,0,0.7);
    border:1px solid rgba(255,210,61,0.4); border-radius:10px; padding:6px 12px; font-size:11px; color:#FFD23D; cursor:pointer; }
  #coreHp { position:absolute; bottom:24px; left:50%; transform:translateX(-50%); z-index:20; width:200px; height:14px;
    background:rgba(0,0,0,0.4); border:1px solid #FFD23D; border-radius:8px; overflow:hidden; }
  #coreHp > div { height:100%; background:linear-gradient(90deg,#FFD23D,#A0F0FF); transition:width 0.3s; }
  #coreLabel { position:absolute; bottom:42px; left:50%; transform:translateX(-50%); z-index:20; font-size:10px; letter-spacing:2px; color:#FFD23D; }
  #muteBtn { position:absolute; top:14px; right:14px; z-index:60; width:38px; height:38px; border-radius:10px;
    background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.25); color:#fff; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
</style>
</head>
<body>
<div id="game">
  <button id="muteBtn" title="소리 켜기/끄기">🔊</button>
  <canvas id="cv"></canvas>
  <div id="start" class="overlay">
    <div class="sub">MATH · AREA & SHAPES</div>
    <h1>도형 방어전</h1>
    <div class="label">수호자 선택</div>
    <div class="char-grid" id="charGrid"></div>
    <div class="label">난이도</div>
    <div class="lvl-row" id="lvlRow"></div>
    <button class="btn" id="startBtn">방어 시작</button>
  </div>
  <div id="hud" class="hidden">
    <div class="hud-box"><div class="k">SCORE</div><div class="v" id="score">0</div></div>
    <div class="hud-box" style="text-align:center"><div class="k">WAVE</div><div class="v" id="wave">1</div></div>
    <div class="hud-box" style="text-align:right"><div class="k">COMBO</div><div class="v" id="comboN">0</div></div>
  </div>
  <div id="rule" class="hidden"><div class="r" id="ruleText">넓이가 12인 도형을 막아라</div><div class="h">조건에 맞는 도형만 탭하세요 · 틀리면 코어 손상</div></div>
  <div id="combo"></div>
  <div id="coreLabel" class="hidden">CORE</div>
  <div id="coreHp" class="hidden"><div id="coreHpBar" style="width:100%"></div></div>
  <div id="over" class="overlay hidden">
    <div class="sub" id="overTitle">DEFENSE FAILED</div>
    <h1 id="overName">결과</h1>
    <div class="final-stat">
      <div><div class="n" id="fScore">0</div><div class="l">점수</div></div>
      <div><div class="n" id="fWave">0</div><div class="l">웨이브</div></div>
      <div><div class="n" id="fBest">0</div><div class="l">최고 콤보</div></div>
    </div>
    <button class="btn" id="retryBtn">다시 방어</button>
    <button class="back" id="toMenu">← 수호자 선택</button>
  </div>
</div>
<script>
/* ===== 공통 사운드 엔진 (Web Audio API, 외부 파일 불필요) ===== */
const SFX = (()=>{
  let ctx=null, muted=false;
  function ac(){ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return ctx; }
  function tone(freq,dur,type='sine',vol=0.2,delay=0){
    const a=ac(); if(!a||muted) return;
    const t=a.currentTime+delay;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.02);
  }
  function slide(f1,f2,dur,type='sine',vol=0.2){
    const a=ac(); if(!a||muted) return;
    const t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
  }
  function noise(dur,vol=0.15){
    const a=ac(); if(!a||muted) return;
    const buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=a.createBufferSource(); s.buffer=buf;
    const g=a.createGain(); g.gain.setValueAtTime(vol,a.currentTime);
    const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=800;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  }
  return {
    correct(){ tone(660,0.08,'square',0.15); tone(880,0.12,'square',0.15,0.07); },
    wrong(){ slide(220,90,0.3,'sawtooth',0.18); },
    combo(n){ const base=520+Math.min(n,12)*40; tone(base,0.08,'triangle',0.18); tone(base*1.5,0.1,'triangle',0.15,0.06); },
    gold(){ tone(784,0.08,'triangle',0.18); tone(988,0.08,'triangle',0.18,0.07); tone(1319,0.14,'triangle',0.18,0.14); },
    shoot(){ slide(880,330,0.12,'square',0.12); },
    boom(){ noise(0.3,0.18); slide(160,50,0.3,'sawtooth',0.12); },
    warp(){ slide(330,1320,0.5,'sine',0.14); },
    click(){ tone(440,0.05,'square',0.12); },
    win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.18,'triangle',0.18,i*0.12)); },
    lose(){ [392,330,262].forEach((f,i)=>tone(f,0.25,'sine',0.18,i*0.14)); },
    toggle(){ muted=!muted; return muted; },
    isMuted(){ return muted; },
    resume(){ const a=ac(); if(a&&a.state==='suspended') a.resume(); }
  };
})();

const CHARS=[
  {id:'prism',nm:'PRISM',ro:'표준',ac:'#FFD23D',gl:'#FFD23Daa',perk:'균형잡힌 결정 기사',svg:svgPrism},
  {id:'calc',nm:'CALC-9',ro:'느린 적',ac:'#7B6CFF',gl:'#7B6CFFaa',perk:'도형이 20% 천천히 이동',svg:svgCalc},
  {id:'stellan',nm:'STELLAN',ro:'점수+',ac:'#FF8A3D',gl:'#FF8A3Daa',perk:'점수 +50%',svg:svgStellan},
  {id:'voxa',nm:'VOXA',ro:'콤보+',ac:'#1FE3A0',gl:'#1FE3A0aa',perk:'콤보 점수 2배',svg:svgVoxa},
  {id:'gaia',nm:'GAIA',ro:'튼튼한 코어',ac:'#FF5C9D',gl:'#FF5C9Daa',perk:'코어 체력 +50%',svg:svgGaia},
];
function svgPrism(){return `<svg viewBox="0 0 60 70"><polygon points="30,30 46,42 42,62 18,62 14,42" fill="#2a2305" stroke="#FFD23D" stroke-width="1.5"/><polygon points="30,4 42,8 46,22 38,34 22,34 14,22 18,8" fill="#2a2305" stroke="#FFD23D" stroke-width="1.5"/><polygon points="22,18 30,14 30,24" fill="#FFD23D"/><polygon points="38,18 30,14 30,24" fill="#FFD23D"/><line x1="24" y1="28" x2="36" y2="28" stroke="#FFD23D" stroke-width="1.5"/></svg>`;}
function svgCalc(){return `<svg viewBox="0 0 60 70"><rect x="14" y="26" width="32" height="34" rx="7" fill="#2a3566" stroke="#7B6CFF" stroke-width="1.5"/><rect x="18" y="8" width="24" height="22" rx="7" fill="#2a3566" stroke="#7B6CFF" stroke-width="1.5"/><rect x="22" y="14" width="7" height="2" fill="#4DD9FF"/><rect x="22" y="18" width="7" height="2" fill="#4DD9FF"/><rect x="31" y="14" width="7" height="2" fill="#4DD9FF"/><rect x="31" y="18" width="7" height="2" fill="#4DD9FF"/></svg>`;}
function svgStellan(){return `<svg viewBox="0 0 60 70"><ellipse cx="30" cy="22" rx="16" ry="18" fill="#241a4a" stroke="#FF8A3D" stroke-width="1.5"/><ellipse cx="30" cy="22" rx="11" ry="13" fill="#0d2444"/><circle cx="25" cy="21" r="2.5" fill="#FFD24D"/><circle cx="35" cy="21" r="2.5" fill="#FFD24D"/><rect x="18" y="40" width="24" height="20" rx="8" fill="#241a4a" stroke="#FF8A3D" stroke-width="1.5"/></svg>`;}
function svgVoxa(){return `<svg viewBox="0 0 60 70"><ellipse cx="30" cy="42" rx="16" ry="20" fill="#0d4630" stroke="#1FE3A0" stroke-width="1.5"/><ellipse cx="30" cy="24" rx="14" ry="13" fill="#0d4630" stroke="#1FE3A0" stroke-width="1.5"/><path d="M20 14 L17 4 Q22 9 24 14Z" fill="#0d4630" stroke="#1FE3A0"/><path d="M40 14 L43 4 Q38 9 36 14Z" fill="#0d4630" stroke="#1FE3A0"/><ellipse cx="25" cy="23" rx="3" ry="4" fill="#9CFF57"/><ellipse cx="35" cy="23" rx="3" ry="4" fill="#9CFF57"/></svg>`;}
function svgGaia(){return `<svg viewBox="0 0 60 70"><path d="M16 40 Q12 58 30 62 Q48 58 44 40Z" fill="#3a1530" stroke="#FF5C9D" stroke-width="1.5"/><ellipse cx="30" cy="24" rx="16" ry="17" fill="#3a1530" stroke="#FF5C9D" stroke-width="1.5"/><path d="M16 22 Q10 6 18 4 Q22 14 20 22Z" fill="#0a5230" stroke="#7CFF9E"/><path d="M44 22 Q50 6 42 4 Q38 14 40 22Z" fill="#0a5230" stroke="#7CFF9E"/><ellipse cx="25" cy="24" rx="3" ry="4" fill="#ffb3d4"/><ellipse cx="35" cy="24" rx="3" ry="4" fill="#ffb3d4"/></svg>`;}

const LEVELS=[{id:1,nm:'입문',speed:0.10},{id:2,nm:'쉬움',speed:0.13},{id:3,nm:'보통',speed:0.17},{id:4,nm:'어려움',speed:0.22},{id:5,nm:'전문가',speed:0.28}];
let selChar=CHARS[0],selLevel=LEVELS[0];

const charGrid=document.getElementById('charGrid');
CHARS.forEach((c,i)=>{const d=document.createElement('div');d.className='char-card'+(i===0?' sel':'');
  d.style.setProperty('--ac',c.ac);d.style.setProperty('--gl',c.gl);
  d.innerHTML=c.svg()+`<div class="nm" style="color:${c.ac}">${c.nm}</div><div class="ro">${c.ro}</div>`;
  d.onclick=()=>{selChar=c;document.querySelectorAll('.char-card').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};
  charGrid.appendChild(d);});
const lvlRow=document.getElementById('lvlRow');
LEVELS.forEach((l,i)=>{const b=document.createElement('div');b.className='lvl-btn'+(i===0?' sel':'');b.textContent=l.nm;
  b.onclick=()=>{selLevel=l;document.querySelectorAll('.lvl-btn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};
  lvlRow.appendChild(b);});

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

let state='menu';
let shapes=[],particles=[];
let score=0,combo=0,bestCombo=0,wave=1,coreHp=100,maxCoreHp=100;
let rule=null, speed=0.12, spawnTimer=0, spawnInterval=1600, lastT=0, shake=0, shapesThisWave=0, waveTarget=8;

/* 도형 타입: rect(가로*세로), triangle(밑변*높이/2), square */
function makeShapeData(forceRect){
  let type;
  if(forceRect && Math.random()<0.7){ type = Math.random()<0.5?'square':'rect'; }
  else { type=['rect','square','triangle'][Math.floor(Math.random()*3)]; }
  let a,b,area,perim,label;
  if(type==='square'){ a=Math.floor(Math.random()*5)+2; area=a*a; perim=a*4; label=`정사각형 (한 변 ${a})`; b=a; }
  else if(type==='rect'){ a=Math.floor(Math.random()*5)+2; b=Math.floor(Math.random()*5)+2; area=a*b; perim=(a+b)*2; label=`직사각형 (${a}×${b})`; }
  else { a=Math.floor(Math.random()*5)+2; b=Math.floor(Math.random()*6)+2; area=a*b/2; perim=null; label=`삼각형 (밑변 ${a}, 높이 ${b})`; }
  return {type,a,b,area,perim,label};
}

function newRule(){
  // 규칙 유형: 넓이일치 / 도형종류 / 둘레일치 / 넓이이상 / 넓이이하 / 홀짝
  const modes=['area','type','area','perim','areaGte','areaLte','parity','parity'];
  const mode=modes[Math.floor(Math.random()*modes.length)];
  if(mode==='area'){
    const target=[4,6,8,9,12,16,20][Math.floor(Math.random()*7)];
    rule={mode,target,text:`넓이가 ${target}인 도형을 막아라`,
      test:s=>Math.abs(s.area-target)<0.01};
  } else if(mode==='areaGte'){
    const target=[10,12,15][Math.floor(Math.random()*3)];
    rule={mode,target,text:`넓이가 ${target} 이상인 도형을 막아라`,
      test:s=>s.area>=target-0.01};
  } else if(mode==='areaLte'){
    const target=[6,8,9][Math.floor(Math.random()*3)];
    rule={mode,target,text:`넓이가 ${target} 이하인 도형을 막아라`,
      test:s=>s.area<=target+0.01};
  } else if(mode==='parity'){
    // 넓이가 정수인 도형만 대상 (삼각형의 7.5 같은 값 제외)
    const even=Math.random()<0.5;
    rule={mode,target:even,text:`넓이가 ${even?'짝수':'홀수'}인 도형을 막아라`,
      test:s=>Number.isInteger(s.area) && (s.area%2===0)===even};
  } else if(mode==='perim'){
    // 사각형 계열만 둘레가 정의됨 → 삼각형은 통과(막을 필요 없음)
    const target=[12,16,20][Math.floor(Math.random()*3)];
    rule={mode,target,text:`둘레가 ${target}인 사각형을 막아라`,
      test:s=>s.perim!==null && Math.abs(s.perim-target)<0.01};
  } else {
    const t=['square','rect','triangle'][Math.floor(Math.random()*3)];
    const nm={square:'정사각형',rect:'직사각형',triangle:'삼각형'}[t];
    rule={mode,target:t,text:`${nm}만 막아라`,test:s=>s.type===t};
  }
  document.getElementById('ruleText').textContent=rule.text;
}

function spawnShape(){
  const forceRect = rule && (rule.mode==='perim' || (rule.mode==='type' && rule.target!=='triangle'));
  const data=makeShapeData(forceRect);
  const golden = Math.random()<0.12; // 황금 도형 (2배 점수)
  // 규칙에 맞는 도형이 적절히 섞이도록
  shapes.push({...data, golden, x:60+Math.random()*(W-120), y:-40, vy:speed*(0.85+Math.random()*0.3),
    rot:Math.random()*0.4-0.2, rotSpeed:(Math.random()-0.5)*0.01, size:1, dead:false, hit:false});
}

function startGame(){
  SFX.resume();
  state='play';score=0;combo=0;bestCombo=0;wave=1;
  maxCoreHp=selChar.id==='gaia'?150:100; coreHp=maxCoreHp;
  speed=selLevel.speed*(selChar.id==='calc'?0.8:1);
  spawnInterval=1600; shapesThisWave=0; waveTarget=8;
  shapes=[];particles=[];
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('rule').classList.remove('hidden');
  document.getElementById('coreHp').classList.remove('hidden');
  document.getElementById('coreLabel').classList.remove('hidden');
  document.getElementById('score').textContent='0';
  document.getElementById('wave').textContent='1';
  document.getElementById('comboN').textContent='0';
  updateCore(); newRule();
  spawnTimer=0;lastT=performance.now();requestAnimationFrame(loop);
}

function updateCore(){document.getElementById('coreHpBar').style.width=Math.max(0,coreHp/maxCoreHp*100)+'%';}

function tapShape(s){
  if(s.dead||s.hit)return;
  const match=rule.test(s);
  if(match){
    // 맞는 도형 파괴 = 정답
    let pts=Math.round((120+combo*(selChar.id==='voxa'?20:10))*(selChar.id==='stellan'?1.5:1));
    if(s.golden){ pts*=2; showCombo('★ GOLD ×2 ★'); SFX.gold(); }
    else if(combo>=3) SFX.combo(combo); else SFX.correct();
    score+=pts;
    combo++; if(combo>bestCombo)bestCombo=combo;
    if(combo>=3 && !s.golden)showCombo(combo);
    explode(s.x,s.y,s.golden?'#FFD24D':selChar.ac); s.dead=true;
    document.getElementById('score').textContent=score;
    document.getElementById('comboN').textContent=combo;
  } else {
    // 안 맞는 도형을 탭 = 실수, 콤보 리셋 + 약간 손상
    SFX.wrong();
    combo=0;document.getElementById('comboN').textContent='0';
    coreHp-=6; updateCore(); shake=8; explode(s.x,s.y,'#FF4D6D');
    s.hit=true; setTimeout(()=>{s.hit=false;},200);
    if(coreHp<=0)endGame();
  }
}

function showCombo(c){const el=document.getElementById('combo');
  el.textContent=(typeof c==='number')?`${c} COMBO!`:c;
  el.style.color=(typeof c==='number')?'#FFD23D':'#FFE9A0';
  el.classList.remove('combo-anim');void el.offsetWidth;el.classList.add('combo-anim');}
function explode(x,y,color){for(let i=0;i<18;i++){const a=Math.random()*7,sp=Math.random()*4+1;
  particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color,size:Math.random()*3+1});}}

function endGame(){state='over';
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('rule').classList.add('hidden');
  document.getElementById('coreHp').classList.add('hidden');
  document.getElementById('coreLabel').classList.add('hidden');
  const ov=document.getElementById('over');ov.classList.remove('hidden');
  document.getElementById('overName').textContent=selChar.nm;
  document.getElementById('overName').style.color=selChar.ac;
  document.getElementById('fScore').textContent=score;
  document.getElementById('fWave').textContent=wave;
  document.getElementById('fBest').textContent=bestCombo;
  const key='shape_best_'+selChar.id,prev=+(localStorage.getItem(key)||0);
  if(score>prev){localStorage.setItem(key,score);document.getElementById('overTitle').textContent='★ NEW BEST! ★';SFX.win();}
  else {document.getElementById('overTitle').textContent='DEFENSE COMPLETE';SFX.lose();}
}

function loop(t){if(state!=='play')return;const dt=Math.min(t-lastT,50);lastT=t;update(dt);render();requestAnimationFrame(loop);}

function update(dt){
  spawnTimer+=dt;
  if(spawnTimer>spawnInterval){spawnTimer=0;spawnShape();shapesThisWave++;
    if(shapesThisWave>=waveTarget){ wave++;shapesThisWave=0;waveTarget+=2;
      speed*=1.08; if(spawnInterval>700)spawnInterval-=80; newRule();
      document.getElementById('wave').textContent=wave; }
  }
  const coreY=H-60;
  shapes.forEach(s=>{
    if(s.dead)return;
    s.y+=s.vy*dt; s.rot+=s.rotSpeed*dt;
    if(s.y>coreY){
      // 코어 도달: 규칙에 맞는 도형이 통과하면 손상
      if(rule.test(s)){ coreHp-=12; updateCore(); shake=10; explode(s.x,coreY,'#FF4D6D'); SFX.boom();
        combo=0;document.getElementById('comboN').textContent='0';
        if(coreHp<=0){s.dead=true;endGame();return;} }
      s.dead=true;
    }
  });
  shapes=shapes.filter(s=>!s.dead);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life-=0.025;});
  particles=particles.filter(p=>p.life>0);
  if(shake>0.5)shake*=0.85;else shake=0;
}

function render(){
  ctx.clearRect(0,0,W,H);ctx.save();
  if(shake>0.5)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  // 코어 라인 + 결정 기사
  const coreY=H-60;
  ctx.strokeStyle=selChar.ac+'44';ctx.lineWidth=2;ctx.setLineDash([6,8]);
  ctx.beginPath();ctx.moveTo(0,coreY);ctx.lineTo(W,coreY);ctx.stroke();ctx.setLineDash([]);
  drawGuardian(W/2,coreY+2);
  shapes.forEach(s=>drawShape(s));
  particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();});
  ctx.globalAlpha=1;ctx.restore();
}

function drawShape(s){
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);
  const sc=12; // 1단위=12px
  const match=rule&&rule.test(s);
  if(s.golden){
    const pulse=0.6+0.4*Math.sin(performance.now()*0.008);
    ctx.strokeStyle=s.hit?'#FF4D6D':'#FFD24D';
    ctx.fillStyle=s.hit?'rgba(255,77,109,0.3)':'rgba(255,210,61,0.28)';
    ctx.lineWidth=3.5; ctx.shadowColor='#FFD24D'; ctx.shadowBlur=16*pulse;
  } else {
    ctx.strokeStyle=s.hit?'#FF4D6D':selChar.ac;
    ctx.fillStyle=s.hit?'rgba(255,77,109,0.3)':'rgba(255,210,61,0.12)';
    ctx.lineWidth=2.5; ctx.shadowColor=selChar.ac; ctx.shadowBlur=match?10:4;
  }
  if(s.type==='square'||s.type==='rect'){
    const w=s.a*sc, h=s.b*sc;
    ctx.beginPath();ctx.rect(-w/2,-h/2,w,h);ctx.fill();ctx.stroke();
  } else {
    const w=s.a*sc, h=s.b*sc;
    ctx.beginPath();ctx.moveTo(0,-h/2);ctx.lineTo(w/2,h/2);ctx.lineTo(-w/2,h/2);ctx.closePath();ctx.fill();ctx.stroke();
  }
  ctx.shadowBlur=0;ctx.rotate(-s.rot);
  // 넓이 라벨
  ctx.fillStyle=s.golden?'#FFE9A0':'#fff';ctx.font='bold 14px Trebuchet MS';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('넓이 '+(s.area%1===0?s.area:s.area.toFixed(1)),0,0);
  if(s.golden){ctx.font='10px serif';ctx.fillText('✦',0,-14);}
  ctx.restore();
}

function drawGuardian(x,y){
  ctx.save();ctx.translate(x,y);ctx.shadowColor=selChar.ac;ctx.shadowBlur=16;
  ctx.fillStyle=selChar.ac;
  // 팔각형 결정
  ctx.beginPath();
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2-Math.PI/8;ctx[i?'lineTo':'moveTo'](Math.cos(a)*22,Math.sin(a)*22-20);}
  ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  // 눈
  ctx.fillStyle='#1a1400';
  ctx.beginPath();ctx.moveTo(-10,-24);ctx.lineTo(-3,-28);ctx.lineTo(-3,-20);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(10,-24);ctx.lineTo(3,-28);ctx.lineTo(3,-20);ctx.closePath();ctx.fill();
  ctx.restore();
}

function tryTap(cx,cy){ if(state!=='play')return;
  // 가장 가까운 도형 탭
  let best=null,bd=9999;
  for(const s of shapes){ if(s.dead)continue; const d=Math.hypot(cx-s.x,cy-s.y);
    if(d<48 && d<bd){bd=d;best=s;} }
  if(best)tapShape(best);
}
cv.addEventListener('click',e=>tryTap(e.clientX,e.clientY));
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];tryTap(t.clientX,t.clientY);},{passive:false});

document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=startGame;
document.getElementById('toMenu').onclick=()=>{state='menu';
  document.getElementById('over').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');};

// 음소거 버튼
(function(){ var b=document.getElementById('muteBtn');
  if(b){ b.onclick=function(){ SFX.resume(); var m=SFX.toggle(); b.textContent = m ? '🔇' : '🔊'; }; }
})();
</script>
