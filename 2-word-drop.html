<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; font-family:'Trebuchet MS',system-ui,sans-serif;
    background:#021a12; color:#fff; user-select:none; }
  #game { position:relative; width:100vw; height:100vh; overflow:hidden;
    background:radial-gradient(circle at 50% 20%, #0a5238 0%, #053826 55%, #021a12 100%); }
  canvas { display:block; width:100%; height:100%; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:24px; background:rgba(2,26,18,0.93);
    backdrop-filter:blur(8px); z-index:50; }

    background:linear-gradient(135deg,#fff,#9CFF57); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .sub { color:#1FE3A0; letter-spacing:4px; font-size:12px; margin-bottom:28px; }
  .char-grid { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:560px; margin-bottom:24px; }
  .char-card { width:96px; padding:12px 8px; border-radius:14px; cursor:pointer; background:rgba(255,255,255,0.04);
    border:2px solid rgba(255,255,255,0.12); transition:all 0.2s; }
  .char-card:hover { transform:translateY(-4px); }
  .char-card.sel { border-color:var(--ac); box-shadow:0 0 20px var(--gl); background:rgba(255,255,255,0.08); }
  .char-card svg { width:52px; height:60px; }
  .char-card .nm { font-size:12px; font-weight:800; margin-top:6px; letter-spacing:1px; }
  .char-card .ro { font-size:9px; color:#888; margin-top:2px; }
  .lvl-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:26px; max-width:480px; }
  .lvl-btn { padding:8px 16px; border-radius:20px; cursor:pointer; font-weight:800; font-size:13px;
    background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.15); color:#bbb; transition:all 0.2s; }
  .lvl-btn.sel { background:#1FE3A0; border-color:#1FE3A0; color:#021a12; box-shadow:0 0 16px #1FE3A088; }

    box-shadow:0 8px 24px rgba(31,227,160,0.4); transition:all 0.2s; }

  .label { font-size:11px; letter-spacing:3px; color:#666; margin-bottom:12px; }

    align-items:flex-start; z-index:20; pointer-events:none; }
  .hud-box { background:rgba(5,56,38,0.7); border:1px solid rgba(31,227,160,0.4); border-radius:12px;
    padding:8px 14px; backdrop-filter:blur(4px); }
  .hud-box .k { font-size:9px; letter-spacing:2px; color:#1FE3A0; }
  .hud-box .v { font-size:20px; font-weight:900; }
  .hearts { font-size:20px; }

/* ===== 공통 사운드 엔진 (Web Audio API, 외부 파일 불필요) ===== */
const SFX = (()=>{
  let ctx=null, muted=false;
  function ac(){ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return ctx; }
  function tone(freq,dur,type='sine',vol=0.2,delay=0){
    const a=ac(); if(!a||muted) return;
    const t=a.currentTime+delay;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.02);
  }
  function slide(f1,f2,dur,type='sine',vol=0.2){
    const a=ac(); if(!a||muted) return;
    const t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
  }
  function noise(dur,vol=0.15){
    const a=ac(); if(!a||muted) return;
    const buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=a.createBufferSource(); s.buffer=buf;
    const g=a.createGain(); g.gain.setValueAtTime(vol,a.currentTime);
    const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=800;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  }
  return {
    correct(){ tone(660,0.08,'square',0.15); tone(880,0.12,'square',0.15,0.07); },
    wrong(){ slide(220,90,0.3,'sawtooth',0.18); },
    combo(n){ const base=520+Math.min(n,12)*40; tone(base,0.08,'triangle',0.18); tone(base*1.5,0.1,'triangle',0.15,0.06); },
    gold(){ tone(784,0.08,'triangle',0.18); tone(988,0.08,'triangle',0.18,0.07); tone(1319,0.14,'triangle',0.18,0.14); },
    shoot(){ slide(880,330,0.12,'square',0.12); },
    boom(){ noise(0.3,0.18); slide(160,50,0.3,'sawtooth',0.12); },
    warp(){ slide(330,1320,0.5,'sine',0.14); },
    click(){ tone(440,0.05,'square',0.12); },
    win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.18,'triangle',0.18,i*0.12)); },
    lose(){ [392,330,262].forEach((f,i)=>tone(f,0.25,'sine',0.18,i*0.14)); },
    toggle(){ muted=!muted; return muted; },
    isMuted(){ return muted; },
    resume(){ const a=ac(); if(a&&a.state==='suspended') a.resume(); }
  };
})();

let selChar=CHARS[0], selLevel=LEVELS[0];
const charGrid=document.getElementById('charGrid');
CHARS.forEach((c,i)=>{const d=document.createElement('div');d.className='char-card'+(i===0?' sel':'');
  d.style.setProperty('--ac',c.ac);d.style.setProperty('--gl',c.gl);
  d.innerHTML=c.svg()+`<div class="nm" style="color:${c.ac}">${c.nm}</div><div class="ro">${c.ro}</div>`;
  d.onclick=()=>{selChar=c;document.querySelectorAll('.char-card').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};
  charGrid.appendChild(d);});
const lvlRow=document.getElementById('lvlRow');
LEVELS.forEach((l,i)=>{const b=document.createElement('div');b.className='lvl-btn'+(i===0?' sel':'');b.textContent=l.nm;
  b.onclick=()=>{selLevel=l;document.querySelectorAll('.lvl-btn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};
  lvlRow.appendChild(b);});

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

let state='menu';
let words=[], particles=[], stars=[];
let score=0,life=3,maxLife=3,combo=0,bestCombo=0,wordCount=0;
let target=null, dragon={x:0,y:0,ac:'#1FE3A0'};
let spawnTimer=0, spawnInterval=2200, fallSpeed=0.22, lastT=0, shake=0;
let wordPool=[];

function initStars(){stars=[];for(let i=0;i<60;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+0.3,s:Math.random()*0.25+0.08});}

function pickTarget(){
  // 현재 단어 풀에서 목표 선정
  const word = wordPool[Math.floor(Math.random()*wordPool.length)];
  target = {en:word[0], ko:word[1]};
  document.getElementById('targetKo').textContent = target.ko;
}

function spawnWord(){
  // 목표 단어 + 방해 단어들 중 하나를 떨어뜨림
  let en, isTarget;
  if(Math.random()<0.45 && !words.some(w=>w.en===target.en)){
    en=target.en; isTarget=true;
  } else {
    const w=wordPool[Math.floor(Math.random()*wordPool.length)];
    en=w[0]; isTarget=(en===target.en);
  }
  // 목표 단어는 15% 확률로 '황금 단어'(2배 점수)
  const golden = isTarget && Math.random()<0.15;
  words.push({en, isTarget, golden, x:60+Math.random()*(W-120), y:-30, caught:false, hue:golden?48:Math.random()*60+90});
}

function startGame(){
  SFX.resume();
  state='play'; score=0;combo=0;bestCombo=0;wordCount=0;
  maxLife=selChar.id==='gaia'?4:3; life=maxLife;
  fallSpeed=selLevel.speed*(selChar.id==='calc'?0.8:1);
  spawnInterval=2200;
  dragon.ac=selChar.ac; dragon.x=W/2; dragon.y=H-150;
  words=[];particles=[];
  wordPool=WORDBANK[selLevel.id];
  initStars();
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('target').classList.remove('hidden');
  document.getElementById('score').textContent='0';
  document.getElementById('comboN').textContent='0';
  updateHearts(); pickTarget();
  spawnTimer=0; lastT=performance.now();
  requestAnimationFrame(loop);
}

function updateHearts(){document.getElementById('hearts').textContent='❤'.repeat(Math.max(0,life))+'♡'.repeat(Math.max(0,maxLife-life));}

function catchWord(w){
  if(w.isTarget){
    let base=Math.round((100+combo*(selChar.id==='prism'?20:10))*(selChar.id==='stellan'?1.5:1));
    if(w.golden){ base*=2; showCombo('★ GOLD ×2 ★'); SFX.gold(); }
    else if(combo>=3) SFX.combo(combo); else SFX.correct();
    score+=base;
    combo++; wordCount++; if(combo>bestCombo)bestCombo=combo;
    if(combo>=3 && !w.golden)showCombo(combo);
    explode(w.x,w.y,w.golden?'#FFD24D':dragon.ac);
    document.getElementById('score').textContent=score;
    document.getElementById('comboN').textContent=combo;
    pickTarget();
    // 같은 목표의 다른 단어 제거
    words=words.filter(x=>x===w?false:true);
  } else {
    SFX.wrong();
    combo=0; document.getElementById('comboN').textContent='0';
    loseLife(); explode(w.x,w.y,'#FF4D6D'); shake=10;
  }
  w.caught=true;
}

function showCombo(c){const el=document.getElementById('combo');
  el.textContent = (typeof c==='number') ? `${c} COMBO!` : c;
  el.style.color = (typeof c==='number') ? '#9CFF57' : '#FFD24D';
  el.classList.remove('combo-anim');void el.offsetWidth;el.classList.add('combo-anim');}
function loseLife(){life--;updateHearts();if(life<=0)endGame();}
function explode(x,y,color){for(let i=0;i<16;i++){const a=Math.random()*7,s=Math.random()*4+1;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,size:Math.random()*3+1});}}

function endGame(){state='over';
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('target').classList.add('hidden');
  const ov=document.getElementById('over');ov.classList.remove('hidden');
  document.getElementById('overName').textContent=selChar.nm;
  document.getElementById('overName').style.color=selChar.ac;
  document.getElementById('fScore').textContent=score;
  document.getElementById('fWords').textContent=wordCount;
  document.getElementById('fBest').textContent=bestCombo;
  const key='word_best_'+selChar.id, prev=+(localStorage.getItem(key)||0);
  if(score>prev){localStorage.setItem(key,score);document.getElementById('overTitle').textContent='★ NEW BEST! ★';SFX.win();}
  else {document.getElementById('overTitle').textContent='GAME OVER';SFX.lose();}
}

function loop(t){if(state!=='play')return;const dt=Math.min(t-lastT,50);lastT=t;update(dt);render();requestAnimationFrame(loop);}

function update(dt){
  stars.forEach(s=>{s.y+=s.s*dt*0.1;if(s.y>H){s.y=0;s.x=Math.random()*W;}});
  spawnTimer+=dt;
  if(spawnTimer>spawnInterval){spawnTimer=0;spawnWord();
    if(spawnInterval>1100)spawnInterval-=18;}
  const catchY=H-150;
  words.forEach(w=>{
    if(w.caught)return;
    w.y+=fallSpeed*dt*0.1;
    // 드래곤 근처에서 자동 판정 (탭으로도 가능)
    if(w.y>catchY){
      // 바닥 도달
      if(w.isTarget){ combo=0;document.getElementById('comboN').textContent='0';loseLife();shake=8; }
      w.caught=true;
    }
  });
  words=words.filter(w=>!w.caught);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life-=0.025;});
  particles=particles.filter(p=>p.life>0);
  if(shake>0.5)shake*=0.85;else shake=0;
}

function render(){
  ctx.clearRect(0,0,W,H);ctx.save();
  if(shake>0.5)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  ctx.fillStyle='#fff';stars.forEach(s=>{ctx.globalAlpha=s.r/1.7;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();});
  ctx.globalAlpha=1;
  // 캐치 라인
  const ly=H-150;ctx.strokeStyle=dragon.ac+'44';ctx.lineWidth=2;ctx.setLineDash([6,8]);
  ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(W,ly);ctx.stroke();ctx.setLineDash([]);
  // 단어 버블
  words.forEach(w=>drawWord(w));
  drawDragon();
  particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();});
  ctx.globalAlpha=1;ctx.restore();
}

function drawWord(w){
  ctx.save();ctx.translate(w.x,w.y);
  ctx.font='bold 20px Trebuchet MS';
  const bw=Math.max(70,ctx.measureText(w.en).width+34),bh=40;
  if(w.golden){
    const pulse=0.6+0.4*Math.sin(performance.now()*0.008);
    ctx.fillStyle='rgba(80,60,10,0.92)';ctx.strokeStyle='#FFD24D';ctx.lineWidth=3;
    ctx.shadowColor='#FFD24D';ctx.shadowBlur=14*pulse;
    roundRect(-bw/2,-bh/2,bw,bh,12);ctx.fill();ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle='#FFE9A0';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='#FFD24D';ctx.shadowBlur=8;
    ctx.fillText(w.en,0,1);ctx.shadowBlur=0;
    // 반짝이 별
    ctx.fillStyle='#fff';ctx.font='10px serif';ctx.fillText('✦',bw/2-6,-bh/2+6);
    ctx.restore();return;
  }
  ctx.fillStyle='rgba(13,70,48,0.9)';ctx.strokeStyle=`hsl(${w.hue},80%,60%)`;ctx.lineWidth=2;
  roundRect(-bw/2,-bh/2,bw,bh,12);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=`hsl(${w.hue},80%,60%)`;ctx.shadowBlur=6;
  ctx.fillText(w.en,0,1);ctx.shadowBlur=0;ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawDragon(){
  const x=dragon.x,y=dragon.y;ctx.save();ctx.translate(x,y);
  ctx.shadowColor=dragon.ac;ctx.shadowBlur=18;
  // 날개
  ctx.fillStyle=dragon.ac+'66';
  ctx.beginPath();ctx.moveTo(-14,-6);ctx.quadraticCurveTo(-42,-22,-30,8);ctx.quadraticCurveTo(-22,14,-12,4);ctx.fill();
  ctx.beginPath();ctx.moveTo(14,-6);ctx.quadraticCurveTo(42,-22,30,8);ctx.quadraticCurveTo(22,14,12,4);ctx.fill();
  // 몸
  ctx.fillStyle=dragon.ac;ctx.beginPath();ctx.ellipse(0,0,18,20,0,0,7);ctx.fill();
  ctx.shadowBlur=0;
  // 배
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.beginPath();ctx.ellipse(0,4,9,12,0,0,7);ctx.fill();
  // 눈
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-6,3.5,0,7);ctx.arc(6,-6,3.5,0,7);ctx.fill();
  ctx.fillStyle='#021a12';ctx.beginPath();ctx.arc(-6,-5,1.8,0,7);ctx.arc(6,-5,1.8,0,7);ctx.fill();
  // 입(받는 중)
  ctx.fillStyle='#021a12';ctx.beginPath();ctx.ellipse(0,8,5,3,0,0,7);ctx.fill();
  ctx.restore();
}

// 입력: 드래곤 이동 + 탭으로 단어 잡기
function pointerMove(clientX){ if(state==='play') dragon.x=Math.max(30,Math.min(W-30,clientX)); }
cv.addEventListener('mousemove',e=>pointerMove(e.clientX));
cv.addEventListener('touchmove',e=>{e.preventDefault();pointerMove(e.touches[0].clientX);},{passive:false});
// 단어 탭 잡기
function tryTap(cx,cy){
  if(state!=='play')return;
  for(const w of words){ if(w.caught)continue;
    if(Math.abs(cx-w.x)<60 && Math.abs(cy-w.y)<28){ catchWord(w); return; } }
}
cv.addEventListener('click',e=>tryTap(e.clientX,e.clientY));
cv.addEventListener('touchstart',e=>{const t=e.touches[0];tryTap(t.clientX,t.clientY);pointerMove(t.clientX);},{passive:true});

// 드래곤이 단어에 닿으면 자동으로 잡기 (이동 캐치)
setInterval(()=>{
  if(state!=='play')return;
  for(const w of words){ if(w.caught)continue;
    if(Math.abs(dragon.x-w.x)<40 && Math.abs(dragon.y-w.y)<34){ catchWord(w); } }
},60);

document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=startGame;
document.getElementById('toMenu').onclick=()=>{state='menu';
  document.getElementById('over').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');};

// 음소거 버튼
(function(){ var b=document.getElementById('muteBtn');
  if(b){ b.onclick=function(){ SFX.resume(); var m=SFX.toggle(); b.textContent = m ? '🔇' : '🔊'; }; }
})();
</script>
</body>
