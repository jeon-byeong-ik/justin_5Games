<script>
/* ===== 공통 사운드 엔진 (Web Audio API, 외부 파일 불필요) ===== */
const SFX = (()=>{
  let ctx=null, muted=false;
  function ac(){ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return ctx; }
  function tone(freq,dur,type='sine',vol=0.2,delay=0){
    const a=ac(); if(!a||muted) return;
    const t=a.currentTime+delay;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.02);
  }
  function slide(f1,f2,dur,type='sine',vol=0.2){
    const a=ac(); if(!a||muted) return;
    const t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
  }
  function noise(dur,vol=0.15){
    const a=ac(); if(!a||muted) return;
    const buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=a.createBufferSource(); s.buffer=buf;
    const g=a.createGain(); g.gain.setValueAtTime(vol,a.currentTime);
    const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=800;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  }
  return {
    correct(){ tone(660,0.08,'square',0.15); tone(880,0.12,'square',0.15,0.07); },
    wrong(){ slide(220,90,0.3,'sawtooth',0.18); },
    combo(n){ const base=520+Math.min(n,12)*40; tone(base,0.08,'triangle',0.18); tone(base*1.5,0.1,'triangle',0.15,0.06); },
    gold(){ tone(784,0.08,'triangle',0.18); tone(988,0.08,'triangle',0.18,0.07); tone(1319,0.14,'triangle',0.18,0.14); },
    shoot(){ slide(880,330,0.12,'square',0.12); },
    boom(){ noise(0.3,0.18); slide(160,50,0.3,'sawtooth',0.12); },
    warp(){ slide(330,1320,0.5,'sine',0.14); },
    click(){ tone(440,0.05,'square',0.12); },
    win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.18,'triangle',0.18,i*0.12)); },
    lose(){ [392,330,262].forEach((f,i)=>tone(f,0.25,'sine',0.18,i*0.14)); },
    toggle(){ muted=!muted; return muted; },
    isMuted(){ return muted; },
    resume(){ const a=ac(); if(a&&a.state==='suspended') a.resume(); }
  };
})();

let selChar=CHARS[0];
const charGrid=document.getElementById('charGrid');
CHARS.forEach((c,i)=>{const d=document.createElement('div');d.className='char-card'+(i===0?' sel':'');
  d.style.setProperty('--ac',c.ac);d.style.setProperty('--gl',c.gl);
  d.innerHTML=c.svg()+`<div class="nm" style="color:${c.ac}">${c.nm}</div><div class="ro">${c.ro}</div>`;
  d.onclick=()=>{selChar=c;document.querySelectorAll('.char-card').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};
  charGrid.appendChild(d);});

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

let state='menu';
let stars=[], particles=[];
let score=0,fuel=3,maxFuel=3,planetIdx=0,correctCount=0,planetsVisited=0;
let calcShield=false; // CALC 1회 보호
let curQuiz=null, curFact='';
let ship={x:0,y:0,tx:0,ty:0,warping:false,angle:0};
let planet={x:0,y:0,r:30,rot:0}, lastT=0, transitioning=false;

function initStars(){stars=[];for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.3,s:Math.random()*0.2+0.05,tw:Math.random()*7});}

function startGame(){
  SFX.resume();
  state='play';score=0;planetIdx=0;correctCount=0;planetsVisited=0;
  maxFuel=selChar.id==='gaia'?4:3; fuel=maxFuel;
  calcShield=(selChar.id==='calc');
  initStars();particles=[];
  ship.x=W/2;ship.y=H-120;ship.warping=false;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('progress').classList.remove('hidden');
  document.getElementById('score').textContent='0';
  buildProgress(); updateFuel();
  arriveAtPlanet();
  lastT=performance.now();requestAnimationFrame(loop);
}

function buildProgress(){
  const p=document.getElementById('progress');p.innerHTML='';
  PLANETS.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i<planetIdx?' done':i===planetIdx?' cur':'');p.appendChild(d);});
}
function updateFuel(){document.getElementById('hearts').textContent='⛽'.repeat(Math.max(0,fuel))+'▢'.repeat(Math.max(0,maxFuel-fuel));}

function arriveAtPlanet(){
  const pl=PLANETS[planetIdx];
  planet={x:W/2,y:H*0.36,r:pl.r,rot:0,color:pl.color};
  document.getElementById('planetN').textContent=pl.nm;
  buildProgress();
  // 퀴즈 표시 (살짝 딜레이)
  setTimeout(showQuiz,700);
}

function showQuiz(){
  if(state!=='play')return;
  const pl=PLANETS[planetIdx];
  // 이 행성의 퀴즈 중 하나를 랜덤 출제, 사실도 랜덤
  curQuiz = pl.quizzes[Math.floor(Math.random()*pl.quizzes.length)];
  curFact = pl.facts[Math.floor(Math.random()*pl.facts.length)];
  document.getElementById('quizPlanet').textContent=`${pl.ico} ${pl.nm} · ${pl.en}`;
  document.getElementById('quizQ').textContent=curQuiz.q;
  const wrap=document.getElementById('opts');wrap.innerHTML='';
  // PRISM 능력: 오답 1개 미리 흐리게
  let removed=-1;
  if(selChar.id==='prism'){ do{removed=Math.floor(Math.random()*4);}while(removed===curQuiz.ans); }
  curQuiz.opts.forEach((o,i)=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o;
    if(i===removed){b.style.opacity='0.3';b.style.textDecoration='line-through';}
    b.onclick=()=>answer(i,b);
    wrap.appendChild(b);
  });
  document.getElementById('quiz').classList.remove('hidden');
}

function answer(i,btn){
  if(transitioning)return;
  const opts=document.querySelectorAll('.opt');
  if(i===curQuiz.ans){
    transitioning=true;
    btn.classList.add('correct');
    SFX.correct();
    score+=Math.round(150*(selChar.id==='voxa'?2:1));
    correctCount++; planetsVisited++;
    document.getElementById('score').textContent=score;
    burstPlanet();
    setTimeout(()=>{ document.getElementById('quiz').classList.add('hidden'); showFact(true); },500);
  } else {
    btn.classList.add('wrong');
    SFX.wrong();
    opts[curQuiz.ans].classList.add('correct');
    // CALC 보호막
    if(calcShield){ calcShield=false; }
    else { fuel--; updateFuel(); }
    transitioning=true;
    setTimeout(()=>{
      document.getElementById('quiz').classList.add('hidden');
      if(fuel<=0){ planetsVisited++; showFact(false,true); }
      else { planetsVisited++; showFact(false); }
    },900);
  }
}

function showFact(correct, gameover){
  const pl=PLANETS[planetIdx];
  const fp=document.getElementById('factPop');
  document.getElementById('factIco').textContent=pl.ico;
  document.getElementById('factTt').textContent=correct?`${pl.nm} 탐험 성공!`:`${pl.nm} 정보`;
  document.getElementById('factTt').style.color=correct?'#1FE3A0':'#FFD24D';
  document.getElementById('factTx').textContent=curFact;
  const nextBtn=document.getElementById('factNext');
  if(gameover){ nextBtn.textContent='결과 보기'; }
  else if(planetIdx>=PLANETS.length-1){ nextBtn.textContent='탐험 완료!'; }
  else { nextBtn.textContent='다음 행성 →'; }
  nextBtn.onclick=()=>{
    fp.classList.add('hidden');
    transitioning=false;
    if(gameover){ endGame(); return; }
    if(planetIdx>=PLANETS.length-1){ endGame(true); return; }
    planetIdx++; warpToNext();
  };
  fp.classList.remove('hidden');
}

function warpToNext(){
  ship.warping=true;
  SFX.warp();
  // 워프 파티클
  for(let i=0;i<30;i++) particles.push({x:ship.x,y:ship.y,vx:(Math.random()-0.5)*2,vy:Math.random()*6+2,life:1,color:selChar.ac,size:Math.random()*3+1});
  setTimeout(()=>{ ship.warping=false; arriveAtPlanet(); },600);
}

function burstPlanet(){
  for(let i=0;i<24;i++){const a=Math.random()*7,s=Math.random()*3+1;
    particles.push({x:planet.x,y:planet.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:planet.color,size:Math.random()*3+1});}
}

function endGame(complete){
  state='over';
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('progress').classList.add('hidden');
  const ov=document.getElementById('over');ov.classList.remove('hidden');
  document.getElementById('overName').textContent=selChar.nm;
  document.getElementById('overName').style.color=selChar.ac;
  document.getElementById('fScore').textContent=score;
  document.getElementById('fPlanets').textContent=planetsVisited;
  document.getElementById('fCorrect').textContent=correctCount;
  document.getElementById('overTitle').textContent= complete?'🏆 태양계 정복!':'탐험 종료';
  const key='solar_best_'+selChar.id,prev=+(localStorage.getItem(key)||0);
  if(score>prev){localStorage.setItem(key,score);
    if(!complete)document.getElementById('overTitle').textContent='★ NEW BEST! ★';}
  if(complete) SFX.win(); else SFX.lose();
}

function loop(t){if(state!=='play')return;const dt=Math.min(t-lastT,50);lastT=t;update(dt);render();requestAnimationFrame(loop);}

function update(dt){
  stars.forEach(s=>{s.y+=s.s*dt*0.1*(ship.warping?8:1);if(s.y>H){s.y=0;s.x=Math.random()*W;}s.tw+=0.05;});
  planet.rot+=0.003*dt;
  // 우주선 떠다님
  ship.y=H-120+Math.sin(performance.now()*0.002)*6;
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.02;});
  particles=particles.filter(p=>p.life>0);
}

function render(){
  ctx.clearRect(0,0,W,H);
  // 별
  stars.forEach(s=>{const tw=0.5+0.5*Math.sin(s.tw);ctx.globalAlpha=s.r/1.8*tw;ctx.fillStyle='#fff';
    if(ship.warping){ctx.strokeStyle='#fff';ctx.lineWidth=s.r;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x,s.y+20);ctx.stroke();}
    else{ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}});
  ctx.globalAlpha=1;
  if(!ship.warping) drawPlanet();
  drawShip();
  particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();});
  ctx.globalAlpha=1;
}

function drawPlanet(){
  const pl=PLANETS[planetIdx];
  ctx.save();ctx.translate(planet.x,planet.y);
  // 후광
  const g=ctx.createRadialGradient(0,0,planet.r,0,0,planet.r*2.2);
  g.addColorStop(0,planet.color+'55');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,planet.r*2.2,0,7);ctx.fill();
  // 본체
  const bg=ctx.createRadialGradient(-planet.r*0.3,-planet.r*0.3,planet.r*0.2,0,0,planet.r);
  bg.addColorStop(0,lighten(planet.color));bg.addColorStop(1,planet.color);
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,planet.r,0,7);ctx.fill();
  // 표면 무늬
  ctx.save();ctx.rotate(planet.rot);ctx.globalAlpha=0.25;ctx.fillStyle='#000';
  for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(Math.cos(i*2)*planet.r*0.3,Math.sin(i*2.5)*planet.r*0.3,planet.r*0.4,planet.r*0.15,i,0,7);ctx.fill();}
  ctx.restore();
  // 토성 고리
  if(pl.en==='SATURN'){ctx.strokeStyle=pl.color;ctx.lineWidth=4;ctx.globalAlpha=0.7;
    ctx.beginPath();ctx.ellipse(0,0,planet.r*1.7,planet.r*0.5,0.3,0,7);ctx.stroke();ctx.globalAlpha=1;}
  // 혜성 꼬리
  if(pl.en==='COMET'){
    const tg=ctx.createLinearGradient(0,0,planet.r*4,-planet.r*1.5);
    tg.addColorStop(0,pl.color+'cc');tg.addColorStop(1,'transparent');
    ctx.fillStyle=tg;ctx.beginPath();ctx.moveTo(0,-planet.r*0.6);
    ctx.lineTo(planet.r*4,-planet.r*2.2);ctx.lineTo(planet.r*4,-planet.r*0.6);ctx.lineTo(0,planet.r*0.6);ctx.closePath();ctx.fill();}
  // 소행성대: 주변에 작은 암석들
  if(pl.en==='ASTEROID BELT'){ctx.fillStyle=lighten(pl.color);
    for(let i=0;i<10;i++){const a=i/10*Math.PI*2+planet.rot;const rr=planet.r*(1.3+0.3*Math.sin(i*3));
      ctx.beginPath();ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,2.5+Math.sin(i)*1.5,0,7);ctx.fill();}}
  // ISS: 태양전지판 표시
  if(pl.en==='ISS'){ctx.strokeStyle='#88aacc';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-planet.r*1.8,0);ctx.lineTo(planet.r*1.8,0);ctx.stroke();
    ctx.fillStyle='#3a5fa0';
    ctx.fillRect(-planet.r*1.7,-planet.r*0.5,planet.r*0.7,planet.r);
    ctx.fillRect(planet.r*1.0,-planet.r*0.5,planet.r*0.7,planet.r);}
  ctx.restore();
}
function lighten(hex){const n=parseInt(hex.slice(1),16);let r=(n>>16)+50,g=((n>>8)&255)+50,b=(n&255)+50;
  r=Math.min(255,r);g=Math.min(255,g);b=Math.min(255,b);return `rgb(${r},${g},${b})`;}

function drawShip(){
  ctx.save();ctx.translate(ship.x,ship.y);ctx.shadowColor=selChar.ac;ctx.shadowBlur=16;
  ctx.fillStyle=selChar.ac;
  ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(14,14);ctx.lineTo(0,8);ctx.lineTo(-14,14);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#FFD24D';ctx.beginPath();ctx.arc(0,-4,5,0,7);ctx.fill();
  // 엔진
  ctx.fillStyle='#FF8A3D';ctx.globalAlpha=0.7+Math.random()*0.3;
  ctx.beginPath();ctx.moveTo(-5,12);ctx.lineTo(0,12+Math.random()*12+(ship.warping?30:8));ctx.lineTo(5,12);ctx.closePath();ctx.fill();
  ctx.globalAlpha=1;ctx.restore();
}

document.getElementById('startBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=startGame;
document.getElementById('toMenu').onclick=()=>{state='menu';
  document.getElementById('over').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');};

// 음소거 버튼
(function(){ var b=document.getElementById('muteBtn');
  if(b){ b.onclick=function(){ SFX.resume(); var m=SFX.toggle(); b.textContent = m ? '🔇' : '🔊'; }; }
})();
</script>
</body>
