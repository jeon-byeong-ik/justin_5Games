<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>구구단 슈팅 · Times Tables Shooter</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; font-family:'Trebuchet MS',system-ui,sans-serif;
    background:#06080f; color:#fff; user-select:none; }
  #game { position:relative; width:100vw; height:100vh; overflow:hidden;
    background:radial-gradient(circle at 50% 30%, #1e2a5e 0%, #0a0e27 60%, #06080f 100%); }
  canvas { display:block; width:100%; height:100%; }

  .overlay { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    background:rgba(6,8,15,0.92); backdrop-filter:blur(8px); z-index:50; }
  .hidden { display:none !important; }

  h1 { font-size:clamp(28px,7vw,44px); font-weight:900; letter-spacing:2px; margin-bottom:6px;
    background:linear-gradient(135deg,#fff,#4DD9FF); -webkit-background-clip:text;
    -webkit-text-fill-color:transparent; }
  .sub { color:#7B6CFF; letter-spacing:4px; font-size:12px; margin-bottom:28px; }

  .char-grid { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:560px; margin-bottom:24px; }
  .char-card { width:96px; padding:12px 8px; border-radius:14px; cursor:pointer;
    background:rgba(255,255,255,0.04); border:2px solid rgba(255,255,255,0.12);
    transition:all 0.2s; }
  .char-card:hover { transform:translateY(-4px); }
  .char-card.sel { border-color:var(--ac); box-shadow:0 0 20px var(--gl); background:rgba(255,255,255,0.08); }
  .char-card svg { width:52px; height:60px; }
  .char-card .nm { font-size:12px; font-weight:800; margin-top:6px; letter-spacing:1px; }
  .char-card .ro { font-size:9px; color:#888; margin-top:2px; }

  .lvl-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:26px; max-width:480px; }
  .lvl-btn { padding:8px 16px; border-radius:20px; cursor:pointer; font-weight:800; font-size:13px;
    background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.15); color:#bbb; transition:all 0.2s; }
  .lvl-btn.sel { background:#7B6CFF; border-color:#7B6CFF; color:#06080f; box-shadow:0 0 16px #7B6CFF88; }

  .btn { padding:14px 40px; border-radius:30px; cursor:pointer; font-weight:900; font-size:17px;
    letter-spacing:1px; border:none; background:linear-gradient(135deg,#7B6CFF,#4DD9FF); color:#06080f;
    box-shadow:0 8px 24px rgba(123,108,255,0.4); transition:all 0.2s; }
  .btn:hover { transform:scale(1.05); }
  .btn:active { transform:scale(0.98); }
  .label { font-size:11px; letter-spacing:3px; color:#666; margin-bottom:12px; }

  /* HUD */
  #hud { position:absolute; top:0; left:0; right:0; padding:14px 18px; display:flex;
    justify-content:space-between; align-items:flex-start; z-index:20; pointer-events:none; }
  .hud-box { background:rgba(10,14,39,0.7); border:1px solid rgba(123,108,255,0.4);
    border-radius:12px; padding:8px 14px; backdrop-filter:blur(4px); }
  .hud-box .k { font-size:9px; letter-spacing:2px; color:#7B6CFF; }
  .hud-box .v { font-size:20px; font-weight:900; }
  .hearts { font-size:20px; letter-spacing:2px; }

  /* 정답 보기 버튼 */
  #answers { position:absolute; bottom:0; left:0; right:0; padding:18px 14px 26px;
    display:flex; gap:10px; justify-content:center; z-index:20; }
  .ans-btn { flex:1; max-width:120px; padding:18px 0; border-radius:16px; cursor:pointer;
    font-size:24px; font-weight:900; border:none; color:#fff; background:rgba(30,42,94,0.85);
    border:2px solid #4DD9FF; box-shadow:0 4px 16px rgba(77,217,255,0.25); transition:all 0.12s; }
  .ans-btn:active { transform:scale(0.94); }
  .ans-btn.correct { background:#1FE3A0 !important; border-color:#1FE3A0; }
  .ans-btn.wrong { background:#FF4D6D !important; border-color:#FF4D6D; }

  #combo { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:48px; font-weight:900; opacity:0; pointer-events:none; z-index:15;
    text-shadow:0 0 20px #4DD9FF; }
  @keyframes pop { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.5);}
    30%{opacity:1;transform:translate(-50%,-50%) scale(1.2);}
    100%{opacity:0;transform:translate(-50%,-80%) scale(1);} }
  .combo-anim { animation:pop 0.8s ease-out; }

  .final-stat { display:flex; gap:24px; margin:18px 0 26px; }
  .final-stat div { text-align:center; }
  .final-stat .n { font-size:32px; font-weight:900; color:#4DD9FF; }
  .final-stat .l { font-size:11px; color:#888; letter-spacing:1px; }
  .back { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:20;
    background:rgba(10,14,39,0.7); border:1px solid rgba(123,108,255,0.4); border-radius:10px;
    padding:6px 12px; font-size:11px; color:#7B6CFF; cursor:pointer; pointer-events:auto; }
  #muteBtn { position:absolute; top:14px; right:14px; z-index:60; width:38px; height:38px; border-radius:10px;
    background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.25); color:#fff; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
</style>
</head>
<body>
<div id="game">
  <button id="muteBtn" title="소리 켜기/끄기">🔊</button>
  <canvas id="cv"></canvas>

  <!-- 시작 화면 -->
  <div id="start" class="overlay">
    <div class="sub">MATH · TIMES TABLES</div>
    <h1>구구단 슈팅</h1>
    <div class="label">파일럿 선택</div>
    <div class="char-grid" id="charGrid"></div>
    <div class="label">난이도 — 곱셈 범위</div>
    <div class="lvl-row" id="lvlRow"></div>
    <button class="btn" id="startBtn">출 격</button>
  </div>

  <!-- 게임 HUD -->
  <div id="hud" class="hidden">
    <div class="hud-box"><div class="k">SCORE</div><div class="v" id="score">0</div></div>
    <div class="hud-box" style="text-align:center"><div class="k">PROBLEM</div><div class="v" id="problem" style="font-size:24px">2 × 3</div></div>
    <div class="hud-box" style="text-align:right"><div class="k">LIFE</div><div class="hearts" id="hearts">❤❤❤</div></div>
  </div>
  <div id="combo"></div>
  <div id="answers" class="hidden"></div>

  <!-- 게임오버 -->
  <div id="over" class="overlay hidden">
    <div class="sub" id="overTitle">MISSION COMPLETE</div>
    <h1 id="overName">결과</h1>
    <div class="final-stat">
      <div><div class="n" id="fScore">0</div><div class="l">점수</div></div>
      <div><div class="n" id="fCorrect">0</div><div class="l">정답</div></div>
      <div><div class="n" id="fBest">0</div><div class="l">최고 콤보</div></div>
    </div>
    <button class="btn" id="retryBtn">다시 출격</button>
    <button class="back" id="toMenu">← 캐릭터 선택</button>
  </div>
</div>

<script>
/* ===== 공통 사운드 엔진 (Web Audio API, 외부 파일 불필요) ===== */
const SFX = (()=>{
  let ctx=null, muted=false;
  function ac(){ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return ctx; }
  function tone(freq,dur,type='sine',vol=0.2,delay=0){
    const a=ac(); if(!a||muted) return;
    const t=a.currentTime+delay;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.02);
  }
  function slide(f1,f2,dur,type='sine',vol=0.2){
    const a=ac(); if(!a||muted) return;
    const t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
  }
  function noise(dur,vol=0.15){
    const a=ac(); if(!a||muted) return;
    const buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=a.createBufferSource(); s.buffer=buf;
    const g=a.createGain(); g.gain.setValueAtTime(vol,a.currentTime);
    const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=800;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  }
  return {
    correct(){ tone(660,0.08,'square',0.15); tone(880,0.12,'square',0.15,0.07); },
    wrong(){ slide(220,90,0.3,'sawtooth',0.18); },
    combo(n){ const base=520+Math.min(n,12)*40; tone(base,0.08,'triangle',0.18); tone(base*1.5,0.1,'triangle',0.15,0.06); },
    gold(){ tone(784,0.08,'triangle',0.18); tone(988,0.08,'triangle',0.18,0.07); tone(1319,0.14,'triangle',0.18,0.14); },
    shoot(){ slide(880,330,0.12,'square',0.12); },
    boom(){ noise(0.3,0.18); slide(160,50,0.3,'sawtooth',0.12); },
    warp(){ slide(330,1320,0.5,'sine',0.14); },
    click(){ tone(440,0.05,'square',0.12); },
    win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.18,'triangle',0.18,i*0.12)); },
    lose(){ [392,330,262].forEach((f,i)=>tone(f,0.25,'sine',0.18,i*0.14)); },
    toggle(){ muted=!muted; return muted; },
    isMuted(){ return muted; },
    resume(){ const a=ac(); if(a&&a.state==='suspended') a.resume(); }
  };
})();

/* ========== 캐릭터 정의 ========== */
const CHARS = [
  { id:'calc', nm:'CALC-9', ro:'밸런스형', ac:'#7B6CFF', gl:'#7B6CFFaa',
    perk:'표준 사격 속도. 어떤 상황에도 안정적.', svg:svgCalc },
  { id:'stellan', nm:'STELLAN', ro:'2점 보너스', ac:'#FF8A3D', gl:'#FF8A3Daa',
    perk:'정답 점수 +50%. 대신 적이 조금 빠르다.', svg:svgStellan },
  { id:'voxa', nm:'VOXA', ro:'콤보 특화', ac:'#1FE3A0', gl:'#1FE3A0aa',
    perk:'콤보 유지가 쉬움. 콤보 점수 2배.', svg:svgVoxa },
  { id:'gaia', nm:'GAIA', ro:'생명력', ac:'#FF5C9D', gl:'#FF5C9Daa',
    perk:'하트 4개로 시작. 더 오래 버틴다.', svg:svgGaia },
  { id:'prism', nm:'PRISM', ro:'시간 정지', ac:'#FFD23D', gl:'#FFD23Daa',
    perk:'적 낙하 속도 20% 감소. 침착하게 계산.', svg:svgPrism },
];

/* 미니 SVG (선택 화면용) */
function svgCalc(){return `<svg viewBox="0 0 60 70"><rect x="14" y="26" width="32" height="34" rx="7" fill="#2a3566" stroke="#7B6CFF" stroke-width="1.5"/><rect x="18" y="8" width="24" height="22" rx="7" fill="#2a3566" stroke="#7B6CFF" stroke-width="1.5"/><rect x="22" y="14" width="7" height="2" fill="#4DD9FF"/><rect x="22" y="18" width="7" height="2" fill="#4DD9FF"/><rect x="31" y="14" width="7" height="2" fill="#4DD9FF"/><rect x="31" y="18" width="7" height="2" fill="#4DD9FF"/><rect x="20" y="34" width="20" height="10" rx="2" fill="#06121f" stroke="#7B6CFF"/><text x="30" y="42" text-anchor="middle" fill="#4DD9FF" font-size="6" font-family="monospace">9×9</text></svg>`;}
function svgStellan(){return `<svg viewBox="0 0 60 70"><ellipse cx="30" cy="22" rx="16" ry="18" fill="#241a4a" stroke="#FF8A3D" stroke-width="1.5"/><ellipse cx="30" cy="22" rx="11" ry="13" fill="#0d2444"/><circle cx="25" cy="21" r="2.5" fill="#FFD24D"/><circle cx="35" cy="21" r="2.5" fill="#FFD24D"/><path d="M25 28 Q30 32 35 28" stroke="#FFD24D" stroke-width="1.5" fill="none"/><rect x="18" y="40" width="24" height="20" rx="8" fill="#241a4a" stroke="#FF8A3D" stroke-width="1.5"/><circle cx="30" cy="50" r="6" fill="#0d0a22" stroke="#FF8A3D"/></svg>`;}
function svgVoxa(){return `<svg viewBox="0 0 60 70"><ellipse cx="30" cy="42" rx="16" ry="20" fill="#0d4630" stroke="#1FE3A0" stroke-width="1.5"/><ellipse cx="30" cy="24" rx="14" ry="13" fill="#0d4630" stroke="#1FE3A0" stroke-width="1.5"/><path d="M20 14 L17 4 Q22 9 24 14Z" fill="#0d4630" stroke="#1FE3A0"/><path d="M40 14 L43 4 Q38 9 36 14Z" fill="#0d4630" stroke="#1FE3A0"/><ellipse cx="25" cy="23" rx="3" ry="4" fill="#9CFF57"/><ellipse cx="35" cy="23" rx="3" ry="4" fill="#9CFF57"/><text x="30" y="48" text-anchor="middle" fill="#9CFF57" font-size="7" font-family="monospace" font-weight="bold">A!</text></svg>`;}
function svgGaia(){return `<svg viewBox="0 0 60 70"><path d="M16 40 Q12 58 30 62 Q48 58 44 40Z" fill="#3a1530" stroke="#FF5C9D" stroke-width="1.5"/><ellipse cx="30" cy="24" rx="16" ry="17" fill="#3a1530" stroke="#FF5C9D" stroke-width="1.5"/><path d="M16 22 Q10 6 18 4 Q22 14 20 22Z" fill="#0a5230" stroke="#7CFF9E"/><path d="M44 22 Q50 6 42 4 Q38 14 40 22Z" fill="#0a5230" stroke="#7CFF9E"/><circle cx="20" cy="6" r="3" fill="#FF5C9D"/><circle cx="40" cy="6" r="3" fill="#FFD24D"/><ellipse cx="25" cy="24" rx="3" ry="4" fill="#ffb3d4"/><ellipse cx="35" cy="24" rx="3" ry="4" fill="#ffb3d4"/></svg>`;}
function svgPrism(){return `<svg viewBox="0 0 60 70"><polygon points="30,30 46,42 42,62 18,62 14,42" fill="#2a2305" stroke="#FFD23D" stroke-width="1.5"/><polygon points="30,4 42,8 46,22 38,34 22,34 14,22 18,8" fill="#2a2305" stroke="#FFD23D" stroke-width="1.5"/><polygon points="22,18 30,14 30,24" fill="#FFD23D"/><polygon points="38,18 30,14 30,24" fill="#FFD23D"/><line x1="24" y1="28" x2="36" y2="28" stroke="#FFD23D" stroke-width="1.5"/><polygon points="30,40 38,48 30,56 22,48" fill="#FFD23D" opacity="0.8"/></svg>`;}

/* ========== 난이도 ========== */
const LEVELS = [
  { id:1, nm:'2~5단', tables:[2,3,4,5], op:'mul' },
  { id:2, nm:'6~9단', tables:[6,7,8,9], op:'mul' },
  { id:3, nm:'전체 곱셈', tables:[2,3,4,5,6,7,8,9], op:'mul' },
  { id:4, nm:'나눗셈', tables:[2,3,4,5,6,7,8,9], op:'div' },
  { id:5, nm:'혼합', tables:[2,3,4,5,6,7,8,9], op:'mix' },
  { id:6, nm:'마스터', tables:[2,3,4,5,6,7,8,9,11,12], op:'mix' },
];

let selChar = CHARS[0];
let selLevel = LEVELS[0];

/* ========== UI 구성 ========== */
const charGrid = document.getElementById('charGrid');
CHARS.forEach((c,i)=>{
  const d = document.createElement('div');
  d.className = 'char-card' + (i===0?' sel':'');
  d.style.setProperty('--ac', c.ac);
  d.style.setProperty('--gl', c.gl);
  d.innerHTML = c.svg() + `<div class="nm" style="color:${c.ac}">${c.nm}</div><div class="ro">${c.ro}</div>`;
  d.onclick = ()=>{ selChar=c; document.querySelectorAll('.char-card').forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); };
  charGrid.appendChild(d);
});
const lvlRow = document.getElementById('lvlRow');
LEVELS.forEach((l,i)=>{
  const b = document.createElement('div');
  b.className = 'lvl-btn' + (i===0?' sel':'');
  b.textContent = l.nm;
  b.onclick = ()=>{ selLevel=l; document.querySelectorAll('.lvl-btn').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); };
  lvlRow.appendChild(b);
});

/* ========== 게임 엔진 ========== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W,H,DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

let state = 'menu';
let enemies = [], particles = [], stars = [], bullets = [];
let score=0, life=3, combo=0, bestCombo=0, correctCount=0;
let problem={a:2,b:3,ans:6}, options=[];
let problemStart=0;
let spawnTimer=0, spawnInterval=2600, baseSpeed=0.35;
let lastT=0;
let ship = { x:0, y:0, ac:'#7B6CFF', ac2:'#4DD9FF' };

function initStars(){
  stars=[];
  for(let i=0;i<70;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.3,s:Math.random()*0.3+0.1});
}

function newProblem(){
  const t = selLevel.tables;
  const a = t[Math.floor(Math.random()*t.length)];
  const b = Math.floor(Math.random()*8)+2;
  // 연산자 결정
  let op = selLevel.op;
  if(op==='mix') op = Math.random()<0.5 ? 'mul' : 'div';
  let qText, ans;
  if(op==='div'){
    // a × b = product, product ÷ a = b 형태 (나누어떨어지게)
    const product = a*b;
    qText = `${product} ÷ ${a}`; ans = b;
  } else {
    qText = `${a} × ${b}`; ans = a*b;
  }
  problem = { a, b, ans, op };
  problemStart = performance.now();
  // 보기 4개 생성
  const opts = new Set([ans]);
  while(opts.size<4){
    let delta = Math.floor(Math.random()*12)-6;
    let cand = ans + delta;
    if(cand>0 && cand!==ans) opts.add(cand);
  }
  options = [...opts].sort(()=>Math.random()-0.5);
  document.getElementById('problem').textContent = qText;
  renderAnswers();
  // 적(운석) 스폰: 각 보기에 해당
  enemies = options.map((val,i)=>({
    val, x: W*(i+0.5)/4, y:-60, alive:true,
    rot:Math.random()*Math.PI, size: 30+Math.random()*6,
  }));
}

function renderAnswers(){
  const wrap = document.getElementById('answers');
  wrap.innerHTML='';
  options.forEach((val,i)=>{
    const b = document.createElement('button');
    b.className='ans-btn'; b.textContent=val;
    b.style.borderColor = ship.ac2;
    b.onclick = ()=>chooseAnswer(val,b);
    wrap.appendChild(b);
  });
}

function chooseAnswer(val, btn){
  if(state!=='play') return;
  const correct = val===problem.ans;
  // 해당 운석 찾기
  const target = enemies.find(e=>e.val===val);
  if(correct){
    btn.classList.add('correct');
    SFX.shoot();
    // 총알 발사
    if(target){ fireBullet(target); }
    let pts = Math.round((100 + combo*(selChar.id==='voxa'?20:10)) * (selChar.id==='stellan'?1.5:1));
    // 스피드 보너스: 2초 이내에 빠르게 맞히면 최대 +50
    const elapsed = (performance.now()-problemStart)/1000;
    const speedBonus = Math.max(0, Math.round(50*(1 - elapsed/2)));
    if(speedBonus>0){ pts+=speedBonus; if(speedBonus>=35) showCombo('⚡ FAST +'+speedBonus); }
    score += pts;
    combo++; correctCount++;
    if(combo>bestCombo) bestCombo=combo;
    if(combo>=3 && speedBonus<35) showCombo(combo);
    if(combo>=3) SFX.combo(combo); else SFX.correct();
    setTimeout(()=>{ if(state==='play') newProblem(); }, 480);
    state='resolving';
    document.getElementById('score').textContent = score;
  } else {
    btn.classList.add('wrong');
    SFX.wrong();
    combo=0;
    loseLife();
    if(target) explode(target.x,target.y,'#FF4D6D');
    setTimeout(()=>btn.classList.remove('wrong'),300);
  }
}

function fireBullet(target){
  bullets.push({ x:ship.x, y:ship.y-30, tx:target.x, ty:target.y, target });
}

function showCombo(c){
  const el = document.getElementById('combo');
  el.textContent = (typeof c==='number') ? `${c} COMBO!` : c;
  el.style.color = (typeof c==='number') ? ship.ac2 : '#FFD24D';
  el.classList.remove('combo-anim'); void el.offsetWidth; el.classList.add('combo-anim');
}

function loseLife(){
  life--;
  updateHearts();
  // 화면 흔들림
  shake=10;
  if(life<=0) endGame();
}
function updateHearts(){
  document.getElementById('hearts').textContent = '❤'.repeat(Math.max(0,life)) + '♡'.repeat(Math.max(0,maxLife-life));
}

let maxLife=3, shake=0;

function explode(x,y,color){
  for(let i=0;i<18;i++){
    const ang=Math.random()*Math.PI*2, sp=Math.random()*4+1;
    particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,color,size:Math.random()*3+1});
  }
}

function startGame(){
  SFX.resume();
  state='play';
  score=0; combo=0; bestCombo=0; correctCount=0;
  maxLife = selChar.id==='gaia'?4:3; life=maxLife;
  ship.ac = selChar.ac; ship.ac2 = selChar.id==='calc'?'#4DD9FF':selChar.ac;
  baseSpeed = 0.35 * (selChar.id==='prism'?0.8:1) * (selChar.id==='stellan'?1.15:1);
  enemies=[]; particles=[]; bullets=[];
  ship.x = W/2; ship.y = H-130;
  initStars();
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('answers').classList.remove('hidden');
  document.getElementById('score').textContent='0';
  updateHearts();
  newProblem();
  lastT=performance.now();
  requestAnimationFrame(loop);
}

function endGame(){
  state='over';
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('answers').classList.add('hidden');
  const ov = document.getElementById('over');
  ov.classList.remove('hidden');
  document.getElementById('overName').textContent = selChar.nm;
  document.getElementById('overName').style.color = selChar.ac;
  document.getElementById('fScore').textContent = score;
  document.getElementById('fCorrect').textContent = correctCount;
  document.getElementById('fBest').textContent = bestCombo;
  // 최고점수 저장
  const key='calc_best_'+selChar.id;
  const prev = +(localStorage.getItem(key)||0);
  if(score>prev){ localStorage.setItem(key,score); document.getElementById('overTitle').textContent='★ NEW BEST! ★'; SFX.win(); }
  else { document.getElementById('overTitle').textContent='MISSION COMPLETE'; SFX.lose(); }
}

function loop(t){
  if(state!=='play' && state!=='resolving'){ return; }
  const dt = Math.min(t-lastT, 50); lastT=t;
  update(dt); render();
  requestAnimationFrame(loop);
}

function update(dt){
  // 별 흐름
  stars.forEach(s=>{ s.y += s.s*dt*0.1; if(s.y>H){s.y=0;s.x=Math.random()*W;} });
  // 운석 낙하
  const limit = H-180;
  enemies.forEach(e=>{
    if(!e.alive) return;
    e.y += baseSpeed*dt*0.1; e.rot+=0.01;
    if(e.y>limit && state==='play'){
      // 정답 운석이 바닥에 닿으면 실점
      if(e.val===problem.ans){
        e.alive=false; explode(e.x,e.y,'#FF4D6D'); combo=0; loseLife();
        if(state==='play') setTimeout(newProblem,400);
        state='resolving';
      } else {
        e.alive=false; // 오답 운석은 그냥 사라짐
      }
    }
  });
  // 총알
  bullets.forEach(b=>{
    const dx=b.tx-b.x, dy=b.ty-b.y, d=Math.hypot(dx,dy);
    if(d<14){ b.hit=true; if(b.target){ explode(b.target.x,b.target.y,ship.ac2); b.target.alive=false; } }
    else { b.x+=dx/d*14; b.y+=dy/d*14; }
  });
  bullets = bullets.filter(b=>!b.hit);
  // 파티클
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life-=0.025; });
  particles = particles.filter(p=>p.life>0);
  if(shake>0) shake*=0.85;
}

function render(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0.5) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  // 별
  ctx.fillStyle='#fff';
  stars.forEach(s=>{ ctx.globalAlpha=s.r/1.8; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); });
  ctx.globalAlpha=1;

  // 바닥 경계선
  const ly=H-180;
  ctx.strokeStyle=ship.ac+'55'; ctx.lineWidth=2; ctx.setLineDash([8,8]);
  ctx.beginPath(); ctx.moveTo(0,ly); ctx.lineTo(W,ly); ctx.stroke(); ctx.setLineDash([]);

  // 운석
  enemies.forEach(e=>{ if(e.alive) drawAsteroid(e); });
  // 총알
  bullets.forEach(b=>{
    ctx.fillStyle=ship.ac2; ctx.shadowColor=ship.ac2; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(b.x,b.y,5,0,7); ctx.fill(); ctx.shadowBlur=0;
  });
  // 우주선
  drawShip();
  // 파티클
  particles.forEach(p=>{
    ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawAsteroid(e){
  ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.rot);
  ctx.fillStyle='#2a3566'; ctx.strokeStyle=ship.ac; ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; const r=e.size*(0.85+0.15*Math.sin(i*3));
    ctx[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.rotate(-e.rot);
  ctx.fillStyle='#fff'; ctx.font='bold 22px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor=ship.ac2; ctx.shadowBlur=8;
  ctx.fillText(e.val,0,0); ctx.shadowBlur=0;
  ctx.restore();
}

function drawShip(){
  const x=ship.x,y=ship.y;
  ctx.save(); ctx.translate(x,y);
  ctx.shadowColor=ship.ac; ctx.shadowBlur=16;
  // 본체
  ctx.fillStyle=ship.ac; ctx.beginPath();
  ctx.moveTo(0,-28); ctx.lineTo(20,18); ctx.lineTo(8,10); ctx.lineTo(0,16);
  ctx.lineTo(-8,10); ctx.lineTo(-20,18); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
  // 콕핏
  ctx.fillStyle=ship.ac2; ctx.beginPath(); ctx.arc(0,-6,6,0,7); ctx.fill();
  // 엔진 불꽃
  ctx.fillStyle=ship.ac2; ctx.globalAlpha=0.6+Math.random()*0.4;
  ctx.beginPath(); ctx.moveTo(-6,16); ctx.lineTo(0,16+Math.random()*14+8); ctx.lineTo(6,16); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();
}

document.getElementById('startBtn').onclick = startGame;
document.getElementById('retryBtn').onclick = startGame;
document.getElementById('toMenu').onclick = ()=>{
  state='menu';
  document.getElementById('over').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
};

// 키보드 지원 (1~4)
window.addEventListener('keydown',e=>{
  if(state!=='play') return;
  const n=parseInt(e.key);
  if(n>=1&&n<=4){ const btns=document.querySelectorAll('.ans-btn'); if(btns[n-1]) btns[n-1].click(); }
});

// 음소거 버튼
(function(){ var b=document.getElementById('muteBtn');
  if(b){ b.onclick=function(){ SFX.resume(); var m=SFX.toggle(); b.textContent = m ? '🔇' : '🔊'; }; }
})();
</script>
